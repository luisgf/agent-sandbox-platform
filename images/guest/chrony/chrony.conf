# ASP guest: the clock comes from the host through the KVM PTP device (ptp_kvm,
# loaded by modules-load.d), not from the network. The guest has no route to a time
# server by design, and a sandbox that lives for days keeps its tokens' exp checks
# honest only if its clock follows the host's.
refclock PHC /dev/ptp0 poll 2 dpoll -2 offset 0

# Step the clock when it is more than a second off, in the first three updates
# (a resumed disk comes back with the time it was stopped at).
makestep 1.0 3

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
