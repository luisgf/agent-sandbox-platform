name: Feature request
description: Propose a new capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should ASP do? Flags, API or CLI shape if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this widen what the guest can reach or what crosses a trust boundary (egress, credentials, host access, identity)? Changes like that usually need an ADR in `docs/adr/`.

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Control plane
        - Node agent
        - pod-daemon (guest)
        - asp CLI / sessions
        - Guest image
        - Egress (proxy, DNS sink, nftables)
        - Local network (--local-net)
        - Identity (IdP, SSH agent, OIDC)
        - Docs
        - Not sure

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
