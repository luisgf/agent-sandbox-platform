# Releases: pushing a tag vX.Y.Z builds the archives, the .deb/.rpm packages, the SBOMs and
# the control plane image with goreleaser (.goreleaser.yaml) and publishes them as a GitHub
# release. How to cut one: docs/how-to/release.md.
#
# Needs nothing but this repository's GITHUB_TOKEN: the image goes to ghcr.io/<owner>/asp-control-plane
# (make that package public once, in the repository's package settings, so it can be pulled
# without a login).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload its files
  packages: write   # push the image to ghcr.io

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # goreleaser reads the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: |
            control-plane/go.*
            node-agent/go.*
            cli/go.*
      # The image is built for amd64 and arm64.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # syft writes the SBOM of each archive.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
