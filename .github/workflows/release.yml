# Releases: pushing a tag vX.Y.Z builds the archives, the .deb/.rpm packages, the SBOMs and
# the control plane image with goreleaser (.goreleaser.yaml) and publishes them as a GitHub
# release. How to cut one: docs/how-to/release.md.
#
# Needs nothing but this repository's GITHUB_TOKEN: the image goes to ghcr.io/<owner>/asp-control-plane
# (make that package public once, in the repository's package settings, so it can be pulled
# without a login).
name: Release

on:
  push:
    tags: ["v*"]
  # A rehearsal from the Actions tab: the same steps as a snapshot, publishing nothing (no release, no
  # image pushed, nothing attached). Run it on main before tagging the first release.
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload its files
  packages: write   # push the image to ghcr.io

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # goreleaser reads the tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: |
            control-plane/go.*
            node-agent/go.*
            cli/go.*
      # The image is built for amd64 and arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # syft writes the SBOM of each archive.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          # A tag publishes. Run by hand, it builds the same things as a snapshot and publishes nothing.
          args: release --clean ${{ github.ref_type == 'tag' && '' || '--snapshot --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The rehearsal's files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  # The guest kernel and image, built twice from scratch (the job fails if the two differ) and
  # published next to the binaries as asp-guest_<version>_{rootfs.img.gz,vmlinux,SHA256SUMS,image.json}:
  # what `asp image pull` downloads and checks.
  guest:
    name: guest image
    needs: release        # the release exists, so the files can be attached to it
    runs-on: ubuntu-latest
    timeout-minutes: 90   # the kernel is compiled, twice, and then the image, twice: about 20 minutes on a hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image twice and compare
        env:
          ASP_GUEST_VERSION: ${{ github.ref_name }}
        run: scripts/build-guest-image.sh --verify --kernel build/guest
      - name: The rehearsal's files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-rehearsal
          path: |
            build/guest/SHA256SUMS
            build/guest/image.json
            build/guest/vmlinux
          if-no-files-found: error
      - name: Attach it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/guest
          for f in rootfs.img.gz vmlinux SHA256SUMS image.json; do
            [ -f "build/guest/$f" ] && cp "build/guest/$f" "/tmp/guest/asp-guest_${v}_$f"
          done
          gh release upload "$GITHUB_REF_NAME" /tmp/guest/* --clobber
