name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - control-plane
          - node-agent
          - cli
          - images/guest/cmd/vsock-ssh-agent-proxy
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # The control plane and the node agent have concurrency tests (store,
        # api, reconciler worker pool): run them under the race detector.
        env:
          MODULE: ${{ matrix.module }}
        run: |
          case "$MODULE" in
            control-plane|node-agent) go test -race ./... ;;
            *) go test ./... ;;
          esac

  staticcheck:
    # staticcheck v0.8 needs Go 1.26 or later to build; it still analyzes
    # modules that declare an older Go version.
    name: staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - control-plane
          - node-agent
          - cli
          - images/guest/cmd/vsock-ssh-agent-proxy
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  postgres:
    name: Go (control-plane store on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asp
          POSTGRES_PASSWORD: asp
          POSTGRES_DB: asp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asp -d asp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://asp:asp@127.0.0.1:5432/asp?sslmode=disable
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.*
      - name: go test (Postgres integration)
        run: go test ./internal/store/... -run Postgres -count=1 -v
      # The API suite on Postgres. Each test binary makes a database of its own on the
      # server, so this and the step above do not touch each other's tables.
      - name: go test (API on Postgres)
        run: ASP_TEST_STORE=postgres go test ./internal/api/... -count=1

  smoke-multi-node:
    name: Smoke (two dry-run nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: |
            control-plane/go.sum
            node-agent/go.sum
      - name: scripts/smoke-multi-node.sh
        run: ./scripts/smoke-multi-node.sh

  # The node's egress rules in nftables for real, in network namespaces of the runner: who reaches the
  # proxy and the DNS sink, what a guest can and cannot send. No guest and no KVM, only root.
  egress-nft:
    name: Egress rules (nftables in namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: scripts/smoke-egress-nft.sh
        run: sudo ./scripts/smoke-egress-nft.sh

  rust:
    name: Rust (pod-daemon)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pod-daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pod-daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pod-daemon/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo test
        run: cargo test --locked
      - name: cargo check (aarch64-unknown-linux-gnu)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo check --locked --all-targets --target aarch64-unknown-linux-gnu
