# Key material out of /tmp (2026-10-06). With ASP_IDP_REQUIRED=1 the control
# plane refuses keys in a temporary directory and exits 2. These are copies of
# the /tmp files it used before, so issued tokens and node certificates stay
# valid. The unit's ASP_*_KEY_PATH lines are ignored: the variables are ASP_*_KEY.
[Service]
StateDirectory=asp-control-plane
StateDirectoryMode=0700
Environment=ASP_CA_CERT=/var/lib/asp-control-plane/ca.crt
Environment=ASP_CA_KEY=/var/lib/asp-control-plane/ca.key
Environment=ASP_OIDC_KEY=/var/lib/asp-control-plane/oidc-key.pem
Environment=ASP_ATTEST_KEY=/var/lib/asp-control-plane/attest-key.pem
