# Postgres 16 for local development and for the Postgres tests of the control plane.
# Usage:
#   docker compose up -d postgres
#   export ASP_DATABASE_URL=postgres://asp:asp@127.0.0.1:5432/asp?sslmode=disable
#   (cd control-plane && go run ./cmd/api)
#   # The control-plane tests that need a server read DATABASE_URL (CI sets the same one):
#   (cd control-plane && DATABASE_URL=$ASP_DATABASE_URL go test ./... -count=1)
# The password is the example one: never use this file for anything that is not your machine.
services:
  postgres:
    image: postgres:16
    container_name: asp-postgres
    environment:
      POSTGRES_USER: asp
      POSTGRES_PASSWORD: asp
      POSTGRES_DB: asp
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp -d asp"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - asp_pgdata:/var/lib/postgresql/data

volumes:
  asp_pgdata:
