# Local corporate smoke: Postgres 16 for control-plane (DATABASE_URL).
# Usage:
#   docker compose up -d postgres
#   export DATABASE_URL=postgres://asp:asp@127.0.0.1:5432/asp?sslmode=disable
#   (cd control-plane && go run ./cmd/api)
#   (cd control-plane && DATABASE_URL=$DATABASE_URL go test ./... -count=1)
services:
  postgres:
    image: postgres:16
    container_name: asp-postgres
    environment:
      POSTGRES_USER: asp
      POSTGRES_PASSWORD: asp
      POSTGRES_DB: asp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asp -d asp"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - asp_pgdata:/var/lib/postgresql/data

volumes:
  asp_pgdata:
